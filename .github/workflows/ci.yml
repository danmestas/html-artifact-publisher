name: CI

# Every pull request and every push runs the checks. A push to main — which
# is what merging a pull request does — then deploys the exact build that
# passed them to Cloudflare.

on:
  push:
  pull_request:

env:
  TINYGO_VERSION: '0.43.0'

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-go@v5
        with:
          go-version-file: fossil/go.mod
          cache-dependency-path: fossil/go.sum

      - name: Cache TinyGo
        id: tinygo-cache
        uses: actions/cache@v4
        with:
          path: ~/tinygo
          key: tinygo-${{ env.TINYGO_VERSION }}-linux-amd64

      - name: Install TinyGo
        if: steps.tinygo-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz" | tar -xz -C ~

      - name: Add TinyGo to PATH
        run: echo "$HOME/tinygo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Generate Wrangler types
        run: npm run types

      - name: TypeScript no-emit
        run: npm run typecheck

      - name: Go vet and unit tests
        run: npm run test:go

      - name: Build the Fossil engine (TinyGo)
        run: npm run build:wasm

      # The comment-link tests clone, add a ticket and push with a stock fossil
      # binary: the official release, pinned by checksum as go-libfossil's CI
      # pins it, not the distro package, which lags several releases. The
      # checksummed tarball is cached, so fossil-scm.org is needed only on a
      # cache miss, not on every run.
      - name: Cache pinned Fossil
        uses: actions/cache@v4
        with:
          path: ~/.cache/fossil-release
          key: fossil-linux-x64-2.28-c9d2bf9d150dff1076eae1b0b822ed3cde892e1273f78b040c4f8ace1b59dd40

      - name: Install pinned Fossil
        env:
          FOSSIL_VERSION: "2.28"
          FOSSIL_SHA256: "c9d2bf9d150dff1076eae1b0b822ed3cde892e1273f78b040c4f8ace1b59dd40"
        run: |
          tarball="$HOME/.cache/fossil-release/fossil-linux-x64-${FOSSIL_VERSION}.tar.gz"
          if ! echo "${FOSSIL_SHA256}  ${tarball}" | sha256sum -c - >/dev/null 2>&1; then
            mkdir -p "$(dirname "$tarball")"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$tarball" \
              "https://fossil-scm.org/home/uv/fossil-linux-x64-${FOSSIL_VERSION}.tar.gz"
          fi
          echo "${FOSSIL_SHA256}  ${tarball}" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin fossil
          fossil version | grep -q "fossil version ${FOSSIL_VERSION} " || { fossil version; exit 1; }

      - name: End-to-end tests
        run: npm test

      - name: Keep the tested build for deploy
        uses: actions/upload-artifact@v4
        with:
          name: fossil-wasm
          path: |
            src/fossil.wasm
            src/wasm_exec.js
          retention-days: 7

  deploy:
    name: Deploy
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # One deploy at a time, in merge order.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch the tested build
        uses: actions/download-artifact@v4
        with:
          name: fossil-wasm
          path: src

      - uses: dopplerhq/cli-action@v3

      # Cloudflare credentials and the Worker's secrets come from Doppler; the
      # only GitHub secret is DOPPLER_TOKEN, a service token for one config.
      - name: Deploy to Cloudflare
        id: deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            # Not set up yet: keep main green and say what is missing.
            echo "::warning::Skipped deploy: set the DOPPLER_TOKEN secret, a Doppler service token for html-artifact-publisher/prd (see README, Deploying)."
            exit 0
          fi
          set -o pipefail
          doppler run -- sh scripts/deploy.sh | tee deploy.log
          url=$(grep '^APP_URL=' deploy.log | cut -d= -f2-)
          public_url=$(grep '^PUBLIC_URL=' deploy.log | cut -d= -f2-)
          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        run: |
          for i in 1 2 3 4 5; do
            if curl -sSf "${{ steps.deploy.outputs.url }}/healthz" && curl -sSf "${{ steps.deploy.outputs.public_url }}/healthz"; then exit 0; fi
            sleep 5
          done
          exit 1
