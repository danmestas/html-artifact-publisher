<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- The Worker fills this in with the response's CSP nonce (src/index.ts, handleViewer). -->
<meta name="artifact-nonce" content="">
<title>Artifact</title>
<script src="/appearance.js"></script>
<link rel="stylesheet" href="/viewer.css">
</head>
<body>
<header id="bar" hidden>
  <div class="bar-left">
    <svg class="mark" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3.5c4.7 0 8.5 3.8 8.5 8.5s-3.8 8.5-8.5 8.5"/><path d="M12 7c2.8 0 5 2.2 5 5s-2.2 5-5 5"/><path d="M12 10.5a1.5 1.5 0 0 1 0 3"/><path d="M3.5 12h8.5"/></svg>
    <h1 id="title"></h1>
    <div class="menu-anchor">
      <button id="versionBtn" class="chip" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="versionMenu">
        <span id="versionHash" class="mono"></span>
        <span id="versionTag" class="tag"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div id="versionMenu" class="popover versions" role="menu" aria-label="Versions" hidden>
        <div class="popover-head"><strong>Versions</strong><span id="versionCount" class="muted"></span></div>
        <div id="versionList"></div>
      </div>
    </div>
  </div>
  <div class="bar-right">
    <a id="backLibrary" href="/" hidden>Library</a>
    <select id="viewer-theme" data-appearance aria-label="Appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    <span id="updated" class="muted"></span>
    <span id="role" class="pill"></span>
    <div class="menu-anchor">
      <button id="shareBtn" aria-label="Share artifact" class="primary" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="shareMenu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <span class="label">Share</span>
      </button>
      <div id="shareMenu" class="popover share" role="dialog" aria-label="Share" hidden>
        <div class="popover-head"><strong>Share this artifact</strong></div>
        <div id="shareRows"></div>
        <div id="shareFoot" class="popover-foot muted"></div>
      </div>
    </div>
    <div class="menu-anchor">
      <button id="moreBtn" class="icon" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
      </button>
      <div id="moreMenu" class="popover more" role="menu" hidden>
        <button id="openLatest" type="button" role="menuitem">Open the latest version</button>
        <button id="deleteBtn" class="danger" type="button" role="menuitem" hidden>Delete artifact</button>
      </div>
    </div>
  </div>
</header>

<div id="oldStrip" role="status" hidden>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
  <span id="oldText"></span>
  <a id="backLatest" class="button" href="#">Back to latest</a>
  <button id="restoreBtn" class="accent" type="button" hidden>Restore this version</button>
</div>

<div id="shell">
  <div id="ring"></div>
  <div id="msg">Loading…</div>
</div>
<iframe id="frame"
  sandbox="allow-scripts allow-forms allow-modals allow-popups"
  referrerpolicy="no-referrer"
  title="Artifact"></iframe>

<div id="toast" role="status" hidden><span id="toastText"></span><button id="toastShow" type="button">Show it</button></div>
<script type="module" src="/viewer.js"></script>
</body>
</html>
